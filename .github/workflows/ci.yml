name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  smoke:
    name: 语法检查 + 覆盖圆脚本编译
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 语法编译检查（纯标准库，无需装依赖）
        run: python -m py_compile scripts/*.py

      - name: 脚本参数自检（--help 应可正常解析退出）
        run: python scripts/coverage_circle.py --help